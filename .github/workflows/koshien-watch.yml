name: koshien-watch

on:
  schedule:
    - cron: "0 10 * * *"   # 19:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Determine model (schedule=sonnet, manual test=haiku)
        id: model
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=claude-haiku-4-5-20251001" >> "$GITHUB_OUTPUT"
          else
            echo "name=claude-sonnet-5" >> "$GITHUB_OUTPUT"
          fi

      - name: Run koshien watch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISCORD_WEBHOOK_KOSHIEN: ${{ secrets.DISCORD_WEBHOOK_KOSHIEN }}
        run: |
          claude -p "$(cat prompt.md)" \
            --model ${{ steps.model.outputs.name }} \
            --allowedTools "WebSearch,WebFetch,Bash,Read,Write" \
            --permission-mode bypassPermissions \
            --max-turns 80

      - name: Save bracket
        run: |
          git config user.name "koshien-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bracket.json
          if git diff --cached --quiet; then
            echo "No bracket changes."
          else
            git commit -m "結果を更新"
            git pull --rebase origin main || true
            git push
          fi
